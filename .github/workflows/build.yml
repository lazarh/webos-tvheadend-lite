name: Build webOS IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package .ipk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPK (ar + tar, no SDK)
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Inspect IPK
        run: |
          set -euo pipefail
          ls -lh dist
          ar t dist/*.ipk

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.lazarh.tvheadend-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
